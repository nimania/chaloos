name: دایجست خبرهای چالوس

on:
  schedule:
    - cron: "*/30 * * * *"  # بررسی هر ۳۰ دقیقه؛ فقط پست‌های منتشرنشده
  workflow_dispatch:
  push:
    paths:
      - "news_digest.py"
      - "chalous_status.py"
      - ".github/workflows/chalous-news.yml"

permissions:
  contents: write

concurrency:
  group: chalous-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ارسال دایجست خبری به کانال
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: "@chaloosradar"
          TG_CHANNEL: chaluscity1
          NEWS_LIMIT: "5"
        run: python news_digest.py
      - name: ذخیرهٔ شناسهٔ پست‌های منتشرشده
        run: |
          if [[ -n "$(git status --porcelain news_state.json)" ]]; then
            git config user.name "chalous-bot"
            git config user.email "bot@users.noreply.github.com"
            git add news_state.json
            git commit -m "record published road reports [skip ci]"
            git pull --rebase
            git push
          fi
