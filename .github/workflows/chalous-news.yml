name: دایجست خبرهای چالوس

on:
  schedule:
    - cron: "*/15 * * * *" # زمان‌بندی پایه؛ فیلتر روزانه با Asia/Tehran
  workflow_dispatch:
  push:
    paths:
      - "news_digest.py"
      - "chalous_status.py"
      - ".github/workflows/chalous-news.yml"

permissions:
  contents: write

concurrency:
  group: chalous-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تعیین نوبت اجرا به وقت تهران
        id: cadence
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("Asia/Tehran"))
          # Python weekdays: Monday=0 ... Sunday=6.
          minutes = {0: 180, 1: 90, 2: 45, 3: 30, 4: 15, 5: 60, 6: 120}
          gap = minutes[now.weekday()]
          slot = now.hour * 60 + now.minute
          run = os.getenv("GITHUB_EVENT_NAME") != "schedule" or slot % gap < 15
          print(f"Tehran: {now.isoformat()} | interval={gap}m | run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.cadence.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: ارسال دایجست خبری به کانال
        if: steps.cadence.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: "@chaloosradar"
          TG_CHANNEL: chaluscity1
          NEWS_LIMIT: "5"
        run: python news_digest.py
      - name: ذخیرهٔ شناسهٔ پست‌های منتشرشده
        if: steps.cadence.outputs.run == 'true'
        run: |
          if [[ -n "$(git status --porcelain news_state.json)" ]]; then
            git config user.name "chalous-bot"
            git config user.email "bot@users.noreply.github.com"
            git add news_state.json
            git commit -m "record published road reports [skip ci]"
            git pull --rebase
            git push
          fi
